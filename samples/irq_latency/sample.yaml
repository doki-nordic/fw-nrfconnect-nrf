sample:
  name: irq_latency Sample
tests:
  sample.irq_latency.build:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf52dk/nrf52832
      - nrf52833dk/nrf52833
      - nrf52840dk/nrf52840
      - nrf52dk/nrf52810
      - nrf5340dk/nrf5340/cpunet
      - nrf21540dk/nrf52840
      - nrf54h20dk/nrf54h20/cpurad
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15pdk/nrf54l15/cpuapp
    platform_allow: >
      nrf52dk/nrf52832
      nrf52833dk/nrf52833
      nrf52840dk/nrf52840
      nrf52dk/nrf52810
      nrf5340dk/nrf5340/cpunet
      nrf21540dk/nrf52840
      nrf54h20dk/nrf54h20/cpurad
      nrf54h20dk/nrf54h20/cpuapp
      nrf54l15pdk/nrf54l15/cpuapp
    tags: irq_latency ci_build sysbuild
